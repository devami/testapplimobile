<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gérez tous vos comptes bancaires personnels : opérations, budgets, échéances, objectifs d'épargne et rapports. Hors-ligne et privé.">
  <meta name="theme-color" content="#2a78d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mes Comptes">
  <title>Mes Comptes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Aller au contenu</a>
  <nav class="nav" aria-label="Navigation principale">
    <div class="brand" aria-hidden="true"><span class="brand-logo">€</span> Mes Comptes</div>
    <a href="#/home" data-route="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span>
    </a>
    <a href="#/accounts" data-route="accounts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>Comptes</span>
    </a>
    <a href="#/tx" data-route="tx">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>Opérations</span>
    </a>
    <a href="#/budgets" data-route="budgets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.5 6"/></svg><span>Budgets</span>
    </a>
    <a href="#/reports" data-route="reports">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Rapports</span>
    </a>
    <a href="#/more" data-route="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Plus</span>
    </a>
  </nav>

  <main id="view" tabindex="-1"></main>

  <button class="fab" data-action="new-tx" aria-label="Nouvelle opération">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div id="sheet-root"></div>
  <div id="tooltip" role="tooltip" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="lock" hidden></div>

  <noscript><p style="padding:16px">Cette application nécessite JavaScript.</p></noscript>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
